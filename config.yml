# 服务设置
server:
  # 服务器监听的主机地址
  # '0.0.0.0' 表示监听所有网络接口,允许来自任何IP的访问。
  # '127.0.0.1' 表示仅监听本地回环地址,只允许本机访问。
  host: 0.0.0.0
  # 服务运行的端口号
  # 推荐使用 3000 或其他未被占用的端口。
  port: 3000

# 各项服务的详细配置
services:
  # 支付服务配置
  payment:
    # 是否启用支付服务
    enabled: true
    # 支付服务URL的前缀,用于区分不同服务的请求
    # 无特殊要求不要改动。
    prefix: /payment
    # 支付后端(支付API)的配置
    backend:
      # 支付API的地址
      host: YOU_PAY_API_IP
      # 支付API的端口
      port: 5001
      # 支付查询的路径
      # 无特殊需求不用改。
      path: /query_payment
  # 充值服务配置
  recharge:
    # 是否启用充值服务
    enabled: true
    # 充值服务URL的前缀
    # 无特殊要求不要改动。
    prefix: /recharge
    # 充值比例,例如 1元 = 6 积分
    pointsRatio: 6
    # 与支付后端同步订单状态的配置
    sync:
      # 同步间隔时间,单位为毫秒 (ms)
      interval: 5000
      # 是否启用同步功能
      enabled: true
  # 后台管理面板配置
  admin:
    # 是否启用后台管理面板
    enabled: true
    # 后台管理面板URL的前缀
    prefix: /admin

# MCSManager (MCSM) 面板对接配置
mcsm:
  # 你的 MCSM 面板的 URL 地址
  panelUrl: YOU_MCSM_IP
  # 你的 MCSM 面板的 API Key,用于进行操作
  apiKey: YOU_HAVE_ADMIN_API_KEY
  # MCSM守护进程ID,通常留空(现在没有以后可能用到)
  daemonId: ''
  # MCSM 用户数据存储路径
  userDataPath: /opt/mcsmanager/web/data/User
  # MCSM 守护进程实例配置数据存储路径
  daemonDataPath: /opt/mcsmanager/daemon/data/InstanceConfig
  # 用户购买/续费服务器后在MCSM服务器上执行的命令,例如重启面板以应用更改
  afterPurchaseCommand: systemctl restart mcsm-web.service

# Docker 相关配置
docker:
  # 创建新 Docker 容器时使用的默认镜像
  defaultImage: azul/zulu-openjdk-debian:17-latest
  # 可供用户选择的 Docker 镜像列表
  availableImages:
    - id: java21
      name: Java 21 (Zulu OpenJDK)
      image: azul/zulu-openjdk-debian:21-latest
      description: 适用于 Minecraft 1.20.5+ 等需要 Java 21 的服务端
    - id: java17
      name: Java 17 (Zulu OpenJDK)
      image: azul/zulu-openjdk-debian:17-latest
      description: 适用于 Minecraft 1.17-1.20.4 等需要 Java 17 的服务端
    - id: java8
      name: Java 8 (Zulu OpenJDK)
      image: azul/zulu-openjdk-debian:8-latest
      description: 适用于 Minecraft 1.16 及更早版本等需要 Java 8 的服务端
    - id: mcdr
      name: MCDReforged (Python 3.12)
      image: mcdreforged/mcdreforged:dev-py3.12
      description: MCDReforged 服务端管理框架，适用于需要插件管理的服务器

# 服务器续费配置
renewal:
  # 每天续费所需的价格(积分)
  pricePerDay: 0.3
  # 续费的最低金额(积分)
  minAmount: 10
  # 默认续费天数
  defaultDays: 30

# 用户认证方式配置
auth:
  # 认证方式。可选值为 'local' 或 'mcsm_bcrypt'。
  # 'local': 使用/data的自带的json进行用户认证。
  # 'mcsm_bcrypt': 使用 MCSManager 面板的 bcrypt 加密方式进行认证,可以与 MCSM 用户数据同步。
  method: mcsm_bcrypt

# 自定义服务器套餐配置
customPlan:
  # 是否启用自定义套餐功能
  enabled: true
  # 自定义套餐积分计算公式
  pointsFormula:
    # 每 MB 内存对应的积分
    memoryPerMB: 0.01
    # 每 1% CPU 对应的积分
    cpuPerPercent: 0.1
    # 每 GB 磁盘空间对应的积分 (mcsm面板未更新api 现在没有用)
    diskPerGB: 0.5
    # 每个额外端口对应的积分
    perPort: 5
  # 自定义套餐的资源限制
  limits:
    minMemory: 512      # 最小内存 (MB)
    maxMemory: 16384    # 最大内存 (MB)
    minCpu: 50          # 最小 CPU (百分比)
    maxCpu: 400         # 最大 CPU (百分比)
    minDisk: 5          # 最小磁盘 (GB)
    maxDisk: 100        # 最大磁盘 (GB)
    minPorts: 1         # 最少端口数
    maxPorts: 10        # 最多端口数
  # 默认购买时长 (天)
  defaultDuration: 30

# 预设的服务器套餐 (未完成)
serverPlans:
  docker_basic:
    name: 基础版
    points: 20
    description: 1核1G内存，开服务器别想了,开个bot可以
    specs:
      cpu: 1
      memory: 1024
      storage: 10G
      duration: 30
      docker:
        image: openjdk:17-slim
        ports:
          - '25565:25565'
        networkMode: bridge
  docker_standard:
    name: 标准版
    points: 25
    description: 2核2G内存，朋友联机用刚刚好
    specs:
      cpu: 2
      memory: 2048
      storage: 20G
      duration: 30
      docker:
        image: openjdk:17-slim
        ports:
          - '25565:25565'
        networkMode: bridge
  docker_premium:
    name: 高级版
    points: 45
    description: 4核4G内存，开个插件服挺好的
    specs:
      cpu: 4
      memory: 4096
      storage: 50G
      duration: 30
      docker:
        image: openjdk:17-slim
        ports:
          - '25565:25565'
        networkMode: bridge

# 每日签到功能配置
checkin:
  # 是否启用每日签到功能
  enabled: true
  # 每日签到基础获得的积分
  basePoints: 10
  # 连续签到的额外奖励积分
  continuousBonus: 5
  # 连续签到奖励的上限
  maxContinuousBonus: 50

# 超级管理员配置
rootAdmin:
  # 超级管理员的登录密码
  password: admin123456

# CORS (跨源资源共享) 配置
cors:
  # 允许访问本服务的来源列表
  # '*' 表示允许任何来源的跨域请求,出于安全考虑,建议设置为您的前端域名。
  allowedOrigins:
    - '*'
