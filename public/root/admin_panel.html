<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板</title>
    <link rel="stylesheet" href="/admin/admin_panel.css">
</head>
<body>
    <!-- 验证中遮罩层 -->
    <div id="auth-loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999;">
        <div style="text-align: center;">
            <div style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
            <p style="color: #666; font-size: 14px;">验证身份中...</p>
        </div>
    </div>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #app {
            display: none; /* 默认隐藏，验证通过后显示 */
        }
    </style>
    
    <div id="app">
        <aside class="sidebar">
            <div class="logo">管理面板</div>
            <nav>
                <ul>
                    <li><a href="#coupon-management">兑换码管理</a></li>
                    <li><a href="#user-management">用户管理</a></li>
                    <li><a href="#announcement-management">公告管理</a></li>
                    <li><a href="#config-management">配置管理</a></li>
                </ul>
            </nav>
        </aside>
        <main class="content">
            <header class="navbar">
                <h1>欢迎来到管理面板</h1>
                <button id="logout-button">退出登录</button>
            </header>
            <section id="coupon-management" class="management-section">
                <h2>兑换码管理</h2>
                <!-- 兑换码管理内容 -->
                <p>这里是兑换码管理区域。</p>
            </section>
            <section id="user-management" class="management-section">
                <h2>用户管理</h2>
                <!-- 用户管理内容 -->
                <p>这里是用户管理区域。</p>
            </section>
            <section id="announcement-management" class="management-section">
                <h2>公告管理</h2>
                <!-- 公告管理内容 -->
                <p>这里是公告管理区域。</p>
            </section>
            <section id="config-management" class="management-section">
                <h2>配置管理</h2>
                <!-- 配置管理内容 -->
                <p>这里是配置管理区域。</p>
            </section>
        </main>
    </div>
    <script src="/admin/js/marked.min.js"></script>
    <script src="/admin/admin_panel.js"></script>
    <script src="/admin/user_management_new.js"></script>
</body>
</html>
