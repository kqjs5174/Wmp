<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员面板</title>
    <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
    <div id="app">
        <div id="setup-container" class="setup-container" style="display: none;">
            <h2>首次设置管理员密码</h2>
            <form id="setup-form">
                <div class="form-group">
                    <label for="password">新密码:</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码:</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit">设置密码</button>
                <p id="setup-message" class="message" style="display: none;"></p>
            </form>
        </div>
        <div id="login-container" class="login-container" style="display: none;">
            <h2>管理员登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="loginPassword">密码:</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit">登录</button>
                <p id="login-message" class="message" style="display: none;"></p>
            </form>
        </div>
    </div>
    <script src="/admin/js/app.js"></script>
    <!-- server.js 会在这里注入 window.rootAdminPasswordSet 变量 -->
</body>
</html>
